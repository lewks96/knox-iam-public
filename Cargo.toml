[workspace]
resolver = "2"

members = [
    "server",
    "bootstrap",
    "crates/*"
]

[workspace.dependencies]
argon2 = { version = "0.5.3" }
axum = { version = "0.8.6", features = ["json", "macros", "multipart"] }
axum-extra = { version = "0.10.2", features = ["cookie", "typed-header"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
base64ct = { version = "1.8.3", features = ["alloc"] }
chrono = { version = "0.4.42", features = ["serde"] }
thiserror = "2.0.16"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
async-trait = "0.1.89"
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["tonic"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "migrate", "chrono", "uuid", "macros"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
redis = { version = "1.0.3", features = ["tokio-comp", "aio", "tokio-native-tls-comp", "connection-manager"] }
base64 = "0.22.1"
sha2 = "0.10.9"
hex = "0.4.3"
subtle = "2.6.1"
ring = "0.17.14"
rcgen = "0.14.7"
rustls-pki-types = "1.14.0"
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
secrecy = "0.10.3"
aes-gcm = "0.10.3"
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.10.0"
rand_core = { version = "0.6", features = ["getrandom"] }
spki = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
totp-rs = { version = "5.7.2", features = ["otpauth"] }

knox-common = { path = "crates/knox-common" }
knox-storage = { path = "crates/knox-storage" }
knox-core = { path = "crates/knox-core" }
knox-services = { path = "crates/knox-services" }
