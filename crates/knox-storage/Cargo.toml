[package]
name = "knox-storage"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serial_test = "3.0"
dotenvy = "0.15"
mockall = "0.14.0"

[dependencies]
sqlx = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
knox-common = { workspace = true, features = ["sqlx"] }
redis = { workspace = true, features = ["tokio-comp", "aio", "tokio-native-tls-comp", "connection-manager"] }
