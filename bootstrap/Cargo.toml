[package]
name = "knox-bootstrap"
version = "0.1.0"
edition = "2024"
description = "CLI tool to bootstrap the Knox IAM platform with a global admin tenant"

[[bin]]
name = "knox-bootstrap"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "postgres", "migrate", "chrono", "uuid", "macros"] }
uuid = { workspace = true, features = ["serde", "v4"] }
redis = { workspace = true, features = ["tokio-comp", "aio", "connection-manager", "tokio-native-tls-comp"] }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

knox-common = { workspace = true }
knox-core = { workspace = true }
knox-storage = { workspace = true }

dotenvy = "0.15.7"
clap = { version = "4.5", features = ["derive"] }
