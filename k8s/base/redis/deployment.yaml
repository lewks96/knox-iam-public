apiVersion: apps/v1
kind: Deployment
metadata:
  name: knox-redis
  namespace: knox
  labels:
    app: knox-redis
    app.kubernetes.io/part-of: knox-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knox-redis
  template:
    metadata:
      labels:
        app: knox-redis
        app.kubernetes.io/part-of: knox-platform
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --save
            - "60"
            - "1"
            - --loglevel
            - warning
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: knox-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knox-redis-pvc
  namespace: knox
  labels:
    app.kubernetes.io/part-of: knox-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

