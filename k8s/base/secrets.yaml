# ⚠ Template only — every value here is a REPLACE_ME placeholder, and this file is
# deliberately absent from base/kustomization.yaml so it cannot be applied by
# accident. scripts/k3d-setup.sh and scripts/seed-secrets.sh generate the real
# local-dev secrets. Anything beyond local dev wants a secrets manager
# (External Secrets Operator, Sealed Secrets, …) rather than YAML in a repo.

---
apiVersion: v1
kind: Secret
metadata:
  name: knox-db-credentials
  namespace: knox
  labels:
    app.kubernetes.io/part-of: knox-platform
type: kubernetes.io/basic-auth
stringData:
  username: knox
  password: REPLACE_ME # Generate a strong password
---
apiVersion: v1
kind: Secret
metadata:
  name: knox-app-secret
  namespace: knox
  labels:
    app.kubernetes.io/part-of: knox-platform
type: Opaque
stringData:
  # Encrypts every tenant's RSA signing key at rest — the highest-value secret
  # here. Generate with `openssl rand -base64 32`. Changing it after tenants
  # exist orphans their keys: the existing ones must be re-wrapped first.
  AES_MASTER_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql://knox:REPLACE_ME@knox-db-rw.knox.svc.cluster.local:5432/knox"
  DATABASE_RO_URL: "postgresql://knox:REPLACE_ME@knox-db-ro.knox.svc.cluster.local:5432/knox"
  REDIS_URL: "redis://knox-redis.knox.svc.cluster.local:6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: knox-aspire-secret
  namespace: knox
  labels:
    app.kubernetes.io/part-of: knox-platform
type: Opaque
stringData:
  OTLP_API_KEY: "REPLACE_ME"
  OTLP_AUTH_HEADER: "Authorization=ApiKey REPLACE_ME"
  DASHBOARD_UI_TOKEN: "REPLACE_ME"

