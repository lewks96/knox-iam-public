apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: knox
  labels:
    app: aspire-dashboard
    app.kubernetes.io/part-of: knox-platform
spec:
  # ClusterIP — UI exposed via Ingress; OTLP port is in-cluster only
  type: ClusterIP
  selector:
    app: aspire-dashboard
  ports:
    - name: ui
      port: 18888
      targetPort: ui
    - name: otlp-grpc
      port: 18889
      targetPort: otlp-grpc

