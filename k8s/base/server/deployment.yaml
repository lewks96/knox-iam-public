apiVersion: apps/v1
kind: Deployment
metadata:
  name: knox-server
  namespace: knox
  labels:
    app: knox-server
    app.kubernetes.io/part-of: knox-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knox-server
  # Wait for new pods to be ready before terminating old ones
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: knox-server
        app.kubernetes.io/part-of: knox-platform
    spec:
      # Spread pods across nodes to survive a node failure
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: knox-server

      # Give the pod 30s to finish in-flight requests before SIGKILL
      terminationGracePeriodSeconds: 30

      initContainers:
        # 1. Wait for Postgres primary to be accepting connections
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z knox-db-rw.knox.svc.cluster.local 5432; do
                echo "waiting for postgres..."; sleep 2
              done
              echo "postgres is ready"

        # 2. Wait for Redis to be accepting connections
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z knox-redis.knox.svc.cluster.local 6379; do
                echo "waiting for redis..."; sleep 2
              done
              echo "redis is ready"

        # 3. Run database migrations — sqlx uses advisory locks so running
        #    this from multiple pods concurrently is safe; only one will
        #    apply pending migrations, the rest will be no-ops.
        #    Uses DATABASE_MIGRATE_URL (direct Postgres) to avoid PgBouncer
        #    transaction-pooling mode breaking advisory locks.
        - name: migrate
          image: knox/knox-iam-migrate:latest
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knox-app-secret
                  key: DATABASE_MIGRATE_URL

      containers:
        - name: server
          image: knox/knox-iam-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: knox-app-config

          # Sensitive config from Secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: knox-app-secret
                  key: DATABASE_URL
            - name: DATABASE_RO_URL
              valueFrom:
                secretKeyRef:
                  name: knox-app-secret
                  key: DATABASE_RO_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: knox-app-secret
                  key: REDIS_URL
            - name: AES_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: knox-app-secret
                  key: AES_MASTER_KEY

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              # Steady-state RSS for a Rust service with sqlx pool, OTLP batch
              # exporters and Redis ConnectionManager sits around 600-750Mi
              # under any traffic. Keep the request close to that so the
              # memory-utilisation HPA target reflects real pressure rather
              # than tripping at idle.
              memory: "1Gi"

          # Readiness: don't route traffic until the server is healthy
          readinessProbe:
            httpGet:
              path: /api/sys/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          # Liveness: restart the pod if it stops responding
          livenessProbe:
            httpGet:
              path: /api/sys/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3

          # Startup: give the server time to boot before liveness kicks in
          startupProbe:
            httpGet:
              path: /api/sys/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 12 × 5s = 60s max startup window

